# =============================================================================
# profiles/example/profile.yaml — the ONE public example of the profile contract (PUBLIC OSS)
# =============================================================================
# This is the ONLY profile shipped in the public OSS repo. It exposes HOW the author
# works (the craft), never WHAT they build (PLUTO / employer). The profile split is the
# anti-leak boundary — see PINKY_WORKSPACE_SPEC.md § Safe exposure.
#
# It activates the generic Snowflake corpus + generic conventions ONLY. Zero reference to
# pinky, PLUTO, or any employer. The check_forbidden_keywords mechanism ships; its values
# do not (forbidden_keywords is empty here).
#
# Adoption model — NO FORK. An adopter does NOT edit this file. They put their own
# profile.yaml + knowledge/ in their own repo and point setup.py --profile at it,
# keeping core/ upstream. This profile is an EXAMPLE of the contract, not a slot to edit.
# =============================================================================

name: example

# visibility — PUBLIC: this profile is a legitimate --check-public scan target. A profile author's
# own private profile sets `visibility: private` instead (refused as a target + becomes a source of
# `leak_patterns` the guard hunts for). Absent key defaults to public.
visibility: public

# knowledge_agents — VIDE, et c'est la démonstration (ADR-0058, vidé le 2026-08-06).
# Ce bloc listait 18 agents à la main : les 13 AGENT_SNOWFLAKE_* et 5 agents de craft. Tous les 18
# sont auto-découverts — les Snowflake par leur `capability: snowflake`, les autres en socle. Les
# lister ne les ajoutait donc pas : ça FORÇAIT les 13 Snowflake sur une machine qui n'a aucun repo
# Snowflake, c'est-à-dire exactement le défaut qu'ADR-0058 a supprimé. Le profil de référence le
# reproduisait, sous les yeux de l'adoptant.
#
# Depuis ADR-0068, un profil ne liste plus RIEN par défaut : déclarer une racine de corpus souscrit
# à son savoir, donc l'auto-découverte sert aussi `<racine>/profiles/<nom>/knowledge/`. Les deux
# profils privés du parc ont vidé cette clé le 2026-08-09 — index rendu identique, à l'agent près.
#
# Le seul cas qui justifie encore de la remplir : un agent situé hors de TOUTE racine déclarée,
# atteint par un `knowledge_roots:` absolu vers un corpus tiers. La découverte ne le verra jamais ;
# la liste reste alors le seul chemin.
#
# Le réflexe par défaut est donc de la laisser vide. Une liste redondante ne peut que mentir : une
# entrée devenue obsolète ne casse rien, elle disparaît silencieusement du rendu.
knowledge_agents: []

# Vide depuis la migration plugins : le savoir n'est plus un corpus de `AGENT_*.md` résolu ici,
# ce sont des skills portées par les plugins, découvertes par leur `description:`. Un chemin
# déclaré ici doit exister (validate_profile le vérifie), donc on ne déclare que ce qui vit.
knowledge_roots: []

rules_overrides:
  []

extra_rules:
  []

# Language policy (ADR-0011) — the public reference keeps everything in the lingua franca.
# An adopter overrides per axis in their own profile (see the flat model: `default` + `overrides`;
# axes: comments, explanation, doc_private, chat, code, docstrings, doc_public, commit, pr).
languages:
  default: en
  # overrides:               # e.g. an adopter who reasons in French:
  #   chat: fr
  #   comments: fr
  #   explanation: fr

# Rigor dial — strict by default: the reference shows adopters the full enforcement preset.
layers:
  agent: true
  hooks: true

# hooks — UNE seule clé sélectionnable depuis ADR-0062 (2026-08-06).
# Ce bloc en listait sept ; `check_snowpark_api` et `check_typed_api` ont quitté le manifeste (ils
# suivent la capacité du repo), et `check_zws` a rejoint le plancher. Résultat : le profil nommait
# des clés inconnues, et `setup.py --repo X --profile snowflake-reference` SORTAIT EN ERREUR — la
# toute première commande d'un adoptant. Invisible ici parce que `--check-public` ne franchit pas
# cette porte.
#
# `check_forbidden_keywords` est le seul hook qu'aucun layout ne prédit : il dépend de QUI est au
# clavier. Le mécanisme est livré, les valeurs jamais (liste vide plus bas).
hooks:
  - check_forbidden_keywords

# Least-agency baseline — mandatory where the machine is not the author's (ADR-0063). The reference
# profile is what a bring-your-own-profile adopter (a sibling, a colleague) starts from, so it ships
# the same baseline the `pluto` org profile already carries in production: deny read/write on SSH and
# cloud credentials, deny .env reads, deny remote-code-execution shells. setup.py renders this
# verbatim (render_settings_deny) — it never hardcodes a deny list itself, see its docstring.
permissions_deny:
  - "Read(~/.ssh/**)"
  - "Read(~/.aws/**)"
  - "Read(**/.env*)"
  - "Write(~/.ssh/**)"
  - "Write(~/.aws/**)"
  - "Bash(curl * | bash)"
  - "Bash(ssh *)"
  - "Bash(scp *)"
  - "Bash(nc *)"

# Fewer-prompts baseline — rendered by setup.py into .claude/settings.json (permissions.allow).
# Safe READ-ONLY bash the framework's own rules/agents trigger constantly (stat after every .md edit,
# read-only git for /commit, find/grep in the audit agents). Generic + harmless → a sensible default
# the reference ships. An adopter trims or extends it in their own profile; per-machine extras stay in
# settings.local.json (the /fewer-permission-prompts skill), which setup.py never touches. Read-only
# git subcommands only (never blanket `git:*` — that would allow push/reset).
permissions_allow:
  - "Bash(ls:*)"
  - "Bash(cat:*)"
  - "Bash(grep:*)"
  - "Bash(rg:*)"
  - "Bash(find:*)"
  - "Bash(stat:*)"
  - "Bash(wc:*)"
  - "Bash(head:*)"
  - "Bash(tail:*)"
  - "Bash(git status:*)"
  - "Bash(git diff:*)"
  - "Bash(git log:*)"
  - "Bash(git show:*)"
  - "Bash(git branch:*)"

# forbidden_keywords — generic mechanism, NO values shipped publicly. An adopter sets
# their own list (inline) or points forbidden_keywords_file at a private out-of-repo file.
forbidden_keywords: []
# forbidden_keywords_file: ~/.pinky/forbidden_keywords.txt   # adopter-provided, out of repo

# behavior — interaction-style knobs. Absent = the engine defaults below, which is why this block
# ships COMMENTED: an adopter should see the vocabulary of each knob without reading setup/, and
# uncommenting one should be a decision, not an inherited accident.
# behavior:
#   challenge: on           # default: on   — push back before executing, zero confirmation bias
#                           # off           — proceed on the user's call without pushback
#   vocabulary: assume      # default: assume — the reader knows the trade's vocabulary
#                           # teach           — use the real term AND gloss it, so they acquire it
#                           # explain         — the reader is NOT a developer: say what a thing does
#                           #                   before naming it, gloss CI / hook / back vs front on
#                           #                   first use. Understanding the decision is the goal,
#                           #                   learning the words is not.
#   derail_handling: park   # default: park — side-quests go to the kanban, current thread continues
#                           # stop          — stop and ask before following a side-quest

model_routing:
  provider: anthropic

  fast:     claude-haiku-4-5
  default:  claude-sonnet-5
  thorough: claude-opus-5

multi_agent:
  max_parallel_tasks: 4
  task_timeout_minutes: 15

# claude_md_extras — adopter org constraints / stack notes go here. Empty in the reference.
claude_md_extras: ""
