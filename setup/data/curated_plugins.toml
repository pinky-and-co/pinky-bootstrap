# The curated plugin list `pinky claude-plugin install`/`enable` offer when no name is given.
# Every entry names a whole marketplace — no `plugin` key, so every
# plugin it publishes shows up individually in the checkbox list.
#
# A machine with access to org-restricted marketplaces (e.g. pinky-agentic-plugins-private) adds
# them in its own user file layered on top of this one — see docs/how-to/install-plugin.md.

[[entries]]
marketplace = "claude-plugins-official"
source = "anthropics/claude-plugins-official"

[[entries]]
marketplace = "pinky-agentic-plugins"
source = "pinky-and-co/pinky-agentic-plugins"

[[entries]]
marketplace = "claude-code-lsps"
source = "Piebald-AI/claude-code-lsps"
