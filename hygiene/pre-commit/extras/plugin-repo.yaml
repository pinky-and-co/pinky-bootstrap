  # ── EXTRA plugin-repo — repos shipping a Claude Code plugin (.claude-plugin/) ────────────
  # Validates the artefacts a plugin repo ships that base.yaml has no schema for: SKILL.md /
  # agent frontmatter, and the legacy commands/*.md format this convention replaces (a hard
  # failure, not a missing-type gap — see the script's own docstring). Distinct from the
  # commit-msg convention (already universal via base.yaml's `commit-msg-format`) and from
  # python-lint's ruff pass (unaffected, still applies independently — this extra is additive).
  - repo: local
    hooks:
      - id: validate-frontmatter
        name: "[FRONTMATTER] SKILL.md / agent schema, no legacy commands/"
        entry: python scripts/hooks/validate_frontmatter.py
        language: python
        files: \.md$
        stages: [pre-commit]

  # `claude plugin validate --strict` on every plugin.json + marketplace.json this repo ships —
  # card `declarer-dependencies-plugin-et-valider-strict.md` (chantier 0023): the dependency between
  # `pc-priv-snow` and `pc-snow` existed only as prose in a `description` string until the CLI grew
  # a native `dependencies` field (2026-08-22) — nothing enforced the field's *shape* at commit time.
  - repo: local
    hooks:
      - id: validate-plugins-strict
        name: "[PLUGIN] claude plugin validate --strict"
        entry: python scripts/hooks/validate_plugins_strict.py
        language: python
        files: (plugins/[^/]+/\.claude-plugin/plugin\.json|\.claude-plugin/marketplace\.json)$
        pass_filenames: false
        stages: [pre-commit]

  # ── Same quality floor as the `python` extra's src/-scoped hooks, for a plugin repo's own
  # Python — plugins/*/hooks/ (inject_policies.py and siblings) AND plugins/*/mcp/ (an MCP
  # server's own Python, e.g. pc-core's mcp/server.py) — both are hand-authored by this repo, not
  # distributed. scripts/hooks/ is DISTRIBUTED, not authored by this repo (DISTRIBUTED_PATHS): a
  # finding there can only be fixed by the provider (pinky-workspace/core/hooks/), never by this
  # consumer — editing it locally is overwritten by the next distribute(). Blocking this repo's
  # commits on code it structurally cannot fix is broken regardless of whether the check is an
  # aggregate score (interrogate) or a per-occurrence finding (mypy/bandit/darglint/check-typed-api)
  # — same reasoning, all five hooks.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy
        language: python
        additional_dependencies: __MYPY_ADDITIONAL_DEPENDENCIES__
        types: [python]
        args: [--ignore-missing-imports]
        files: ^plugins/[^/]+/(hooks|mcp)/
        require_serial: true

  - repo: https://github.com/PyCQA/bandit
    rev: "1.9.4"
    hooks:
      - id: bandit
        pass_filenames: false
        args: [-r, plugins/, -ll]
        files: ^plugins/[^/]+/(hooks|mcp)/

  - repo: local
    hooks:
      - id: interrogate
        name: "[DOCSTRING] Coverage"
        entry: interrogate
        language: python
        additional_dependencies: ["interrogate==1.7.0"]
        pass_filenames: false
        args: [plugins/, --ignore-init-method, --ignore-magic, --ignore-module, --ignore-private]
        files: ^plugins/[^/]+/(hooks|mcp)/

  - repo: local
    hooks:
      - id: darglint
        name: "[DOCSTRING] Args/Returns match"
        entry: darglint
        language: python
        additional_dependencies: ["darglint==1.8.1"]
        types: [python]
        files: ^plugins/[^/]+/(hooks|mcp)/

  - repo: local
    hooks:
      - id: check-typed-api
        name: "[TYPED-API] No raw dict/tuple/set in public annotations"
        entry: python scripts/hooks/check_typed_api.py
        language: python
        types: [python]
        files: ^plugins/[^/]+/(hooks|mcp)/
