  # ── EXTRA plugin-repo — repos shipping a Claude Code plugin (.claude-plugin/) ────────────
  # Validates the artefacts a plugin repo ships that base.yaml has no schema for: SKILL.md /
  # agent frontmatter, and the legacy commands/*.md format this convention replaces (a hard
  # failure, not a missing-type gap — see the script's own docstring). Distinct from the
  # commit-msg convention (already universal via base.yaml's `commit-msg-format`) and from
  # python-lint's ruff pass (unaffected, still applies independently — this extra is additive).
  # Every finding blocks, so a passing run has nothing to say and `verbose` stays off.
  - repo: local
    hooks:
      - id: validate-frontmatter
        name: "[FRONTMATTER] SKILL.md / agent schema, no legacy commands/"
        entry: python scripts/hooks/validate_frontmatter.py
        language: python
        files: \.md$
        stages: [pre-commit]

  # `claude plugin validate --strict` on every plugin.json + marketplace.json this repo ships —
  # card `declarer-dependencies-plugin-et-valider-strict.md` (chantier 0023): the dependency between
  # `pc-priv-snow` and `pc-snow` existed only as prose in a `description` string until the CLI grew
  # a native `dependencies` field (2026-08-22) — nothing enforced the field's *shape* at commit time.
  - repo: local
    hooks:
      - id: validate-plugins-strict
        name: "[PLUGIN] claude plugin validate --strict"
        entry: python scripts/hooks/validate_plugins_strict.py
        language: python
        files: (plugins/[^/]+/\.claude-plugin/plugin\.json|\.claude-plugin/marketplace\.json)$
        pass_filenames: false
        stages: [pre-commit]

  # Card `decouper-pc-core-en-pc-git-et-pc-kanban.md` (chantier 0023): a plugin split across two
  # plugins can vendor a small shared utility (policy_lib, secret_patterns, plugin_scope_lib,
  # pending_user_action) since neither plugin can import the other's files at runtime. This hook
  # catches a hand-edited copy drifting from the pinky-bootstrap source instead of letting the next
  # `pinky repo distribute` silently overwrite it.
  - repo: local
    hooks:
      - id: check-vendor-checksum
        name: "[VENDOR] Vendored file matches its source checksum"
        entry: python scripts/hooks/check_vendor_checksum.py
        language: python
        files: \.vendor-manifest\.json$|(hooks|scripts)/(pc_git_policy_lib|pc_kanban_secret_patterns|pc_kanban_plugin_scope_lib|pc_kanban_spawn_plugin_scope_lib|pc_kanban_pending_user_action|pc_git_direct_command_runner|pc_kanban_direct_command_runner|pc_rtk_direct_command_runner|policy_lib|secret_patterns|plugin_scope_lib|pending_user_action)\.py$
        pass_filenames: false
        stages: [pre-commit]

  # No mypy/bandit/interrogate/darglint/check-typed-api here any more: they were a narrower copy
  # (`^plugins/[^/]+/(hooks|mcp)/`) of the `python` extra's src/-scoped hooks, added while that extra
  # was hardcoded to `^src/` and therefore inert on a `plugins/` layout. Since `_py_lint_roots`
  # derives the scope (2026-09), the `python` extra resolves to `^plugins/` for a plugin repo — a
  # strict superset that also covers `skills/<name>/scripts/` — so this copy was pure duplication
  # (every hook ran twice per commit) and its `bandit` was the one place workspace-wide `--skip B108`
  # did not apply. Assumption: a plugin repo carries a `pyproject.toml` (both do today), which is
  # what activates the `python` extra; a future plugin repo without one would get `python-lint`
  # (ruff only) and need this revisited.
