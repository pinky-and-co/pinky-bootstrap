---
# =============================================================================
# .pre-commit-config.yaml — GENERATED by pinky-workspace/setup.py — DO NOT EDIT
# =============================================================================
# Source: pinky-workspace/core/pre-commit/{base,extras/*}.yaml
# Third-party revs are pinned centrally in this base — bump them here, once.
# To change which hooks a repo gets, edit the workspace source and re-run setup.py.
#
# Install (done automatically by setup.py):
#   pip install pre-commit
#   pre-commit install
#   pre-commit install --hook-type commit-msg
# =============================================================================
default_install_hook_types: [pre-commit, commit-msg]
# Pin explicite : sans ça, les hooks `language: python` (mdformat, mypy, interrogate, darglint…)
# créent leur venv avec le python3 ambiant du PATH au moment de l'install, pas une version garantie
# par le repo — non-déterministe en local (CI est protégée par actions/setup-python en amont).
#
# Règle (2026-07-22) : tout hook `repo: local` dont l'`entry` commence par `python` DOIT être
# `language: python`, jamais `language: system`. `system` exécute la commande telle quelle dans le
# shell, et `python` nu n'existe ni sur macOS hors conda (homebrew ne pose que `python3`) ni sur une
# machine Windows vanilla — ça ne marchait que par l'auto-activation de conda base. Avec
# `language: python`, prek provisionne l'interpréteur (et le télécharge s'il manque) et met le bin/
# de son venv en tête du PATH : `python` y est garanti sur les trois OS. Les scripts de
# scripts/hooks/ étant 100 % stdlib, ils partagent tous un seul venv (dédupliqué par langage +
# version + additional_dependencies) — coût quasi nul.
default_language_version:
  python: python3.12

repos:
  # ── Formatting: trailing spaces + newline ─────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: ^docs/reference/generated/
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements

  # ── Docs generation: README + docs/index.md + quality badges ──────────────
  # Universal (every repo, not just the snowflake extra — 2026-07-10, renamed/extended from
  # check-docs-up-to-date). Runs before mdformat below so the regenerated README gets reformatted.
  - repo: local
    hooks:
      - id: generate-docs
        name: Generate docs (README + index.md + badges)
        entry: scripts/hooks/generate-docs
        language: script
        stages: [pre-commit]
        pass_filenames: false

  # ── Test suite: the blocking quality gate ─────────────────────────────────
  # Universal, NOT the `python` extra (moved 2026-07-25, same day it was introduced). The first
  # placement rested on an unverified assumption — "the repos outside the python extra have no test
  # suite". Measured: pinky-workspace, the engine itself, carries 25 test files / 264 tests, and
  # pinky-studio carries tests with NO CI at all. Only assets/infra have no tests/ directory, and
  # the hook's own `[ -d tests ]` guard makes those a real no-op.
  #
  # Before this hook, the only test execution at commit time was the one buried inside generate-docs
  # feeding the coverage badge, whose failure printed a warning and returned 0 — a broken suite
  # passed pre-commit. generate-docs keeps its own run for the badge data and stays non-blocking;
  # this hook owns the verdict. See core/hooks/run-tests for why the two runs stay independent, and
  # why an absent pytest warns instead of blocking.
  - repo: local
    hooks:
      - id: run-tests
        name: "[TESTS] Suite must pass"
        entry: scripts/hooks/run-tests
        language: script
        # PAS de `files:` — retiré le 2026-08-07. Il valait `^(src|tests)/`, c'est-à-dire une
        # ALLOWLIST DE LAYOUTS : elle énumérait les arborescences connues, donc elle était fausse par
        # défaut pour toute autre. Le moteur lui-même en était la preuve — son code vit dans `setup/`,
        # que ce motif n'a jamais matché : aucun commit ne touchant que `setup/*.py` n'a lancé la
        # suite. Même trou côté repos data (`resources/`), et côté n'importe quel paquet Python en
        # flat layout, qui est un layout parfaitement valide (la PyPA documente `src/` et flat comme
        # deux options).
        #
        # Élargir le motif aurait reproduit le défaut une arborescence plus loin. Le supprimer rend le
        # portier correct PAR CONSTRUCTION : `scripts/hooks/run-tests` détecte déjà les suites
        # lui-même (pytest sur `tests/`, `npm test` ou `node --test` sur les signaux JS) et sort en 0
        # quand il n'y en a aucune. Le filtre ne garantissait rien — il ne faisait que décider QUAND
        # invoquer un script qui sait déjà ne rien faire.
        #
        # Coût assumé : un commit de documentation seule lance la suite. C'est le prix d'un portier
        # qui ne peut plus rater un layout, et il est visible — un portier qui ne se déclenche pas ne
        # l'est pas.
        pass_filenames: false
        stages: [pre-commit]

  # ── Formatting: Markdown ──────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: mdformat
        name: mdformat
        entry: mdformat
        language: python
        additional_dependencies: ["mdformat==1.0.0"]
        files: ^README\.md$

  # ── Security: secrets & forbidden files ──────────────────────────────────
  # gitleaks' hook has pass_filenames: false (it scans the repo itself, not a file list pre-commit
  # hands it) — a pre-commit `exclude:` here would be silently inert. The real exclusion mechanism
  # is the distributed .gitleaks.toml allowlist (see distribute()/DISTRIBUTED_PATHS): .secrets.baseline
  # stores detect-secrets' accepted findings as SHA1 hashes, never the raw secret, but a high-entropy
  # hash next to a "secret"-shaped key still trips gitleaks' generic-api-key heuristic (found rolling
  # this out to pinky-studio, the first repo whose baseline had a real finding instead of an empty
  # result set).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  # ── Security: alternative secret detection ────────────────────────────────
  # pylock.toml is excluded for the same reason uv.lock needs no exclusion: it is a lock file full of
  # wheel SHA-256 digests, which read as "hex high entropy strings". detect-secrets has a filter for
  # exactly this (heuristic.is_lock_file) but it matches a hardcoded list of names — package-lock.json,
  # poetry.lock, uv.lock… — and pylock.toml, produced by pywrangler when bundling a Python Worker,
  # is not on it. Found the first time a repo here shipped a Python Worker (2026-07-31); it will hit
  # every such repo, hence the fix here rather than a baseline entry per repo — a baseline would
  # also have to be re-audited on every dependency bump.
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: ^(docs/|pylock\.toml$|\.vendor-manifest\.json$|scripts/hooks/docs_identity\.json$)

  # ── Zero-width spaces (copy-paste from Outlook/Teams) ────────────────────
  - repo: local
    hooks:
      - id: check-zws
        name: "[ZWS] Invisible characters (zero-width)"
        entry: python scripts/hooks/check_zws.py
        language: python
        pass_filenames: true

  # ── Raw LaTeX notation (local LLM fallback, e.g. Gemma via Ollama) ────────
  - repo: local
    hooks:
      - id: check-latex-notation
        name: "[LATEX] Raw LaTeX instead of Unicode symbol"
        entry: python scripts/hooks/check_latex_notation.py
        language: python
        pass_filenames: true

  # ── Employer reference guard ──────────────────────────────────────────────
  - repo: local
    hooks:
      - id: check-forbidden-keywords
        name: "[FORBIDDEN] Employer references"
        entry: python scripts/hooks/check_forbidden_keywords.py
        language: python
        pass_filenames: true

  # ── Requirement ids: dead references to a story outside the repo (blocking) ─
  - repo: local
    hooks:
      - id: check-requirement-ids
        name: "[REQ-ID] No requirement ids in repo files"
        entry: python scripts/hooks/check_requirement_ids.py
        language: python
        types: [text]
        exclude: ^(scripts/hooks/|hygiene/hooks/|tests/test_check_(narrative_comments|requirement_ids)\.py$)

  # ── Narrated history in comments and docstrings (bloquant) ────────────────
  # Un nom de fichier légitime va en docstring, pas en commentaire — c'est l'échappatoire.
  - repo: local
    hooks:
      - id: check-narrative-comments
        name: "[NARRATIVE] History in comments and docstrings"
        entry: python scripts/hooks/check_narrative_comments.py
        language: python
        types: [python]
        exclude: ^scripts/hooks/

  # ── Commit message format ─────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: commit-msg-format
        name: Commit message format
        entry: scripts/hooks/commit-msg
        language: script
        stages: [commit-msg]
