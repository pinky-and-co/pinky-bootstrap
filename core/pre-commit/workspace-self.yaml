  # ── SELF (moteur-only) — public-corpus leak guard ────────────────────────────
  # Appended by build_precommit_config ONLY when the target repo IS the moteur
  # itself (repo.resolve() == SCRIPT_DIR.resolve()). Consumer repos never receive
  # it: the guard needs setup.py, corpus-public/ and the private profiles — all of
  # which exist only here. Makes --check-public BLOCK at write time instead of
  # relying on a human remembering to run it (ADR-0009), the anti-leak analogue of
  # the kanban's "the agent is the reliable trigger". pass_filenames:false +
  # always_run:true → scans the whole rendered public profile, not staged files.
  - repo: local
    hooks:
      - id: check-public-leak
        name: "[LEAK] Product/private refs in public corpus"
        entry: python setup.py --check-public
        # language: python (pas `system`) — prek provisionne l'interpréteur, donc `python` existe
        # toujours, y compris dans un shell sans conda ni venv activé. Seul hook `local` à déclarer
        # une dépendance : --check-public résout un profil, donc traverse le chemin pyyaml de
        # setup/ (mesuré — sans lui, exit 1 « --profile requires pyyaml », le guard resterait
        # bloqué en échec permanent). Les autres hooks scripts sont 100 % stdlib.
        language: python
        additional_dependencies: ["pyyaml==6.0.3"]
        pass_filenames: false
        always_run: true
