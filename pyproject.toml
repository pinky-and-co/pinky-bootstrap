[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pinky-bootstrap"
# Same dev-pre-release scheme as the other pinky-* libs (v0.1.0.dev1, never dev0 — see their tags).
# Surfaced at runtime by `common.engine_version()`, distributed into every repo's docs_identity.json
# as `engine_version` (card `versionner-le-moteur`). No PyPI publish here (ADR-0065 decision 5): the
# git tag alone is the version, consumed via `uv tool install git+<url>@v<version>`.
version = "0.1.0.dev1"
# The data-warehouse vendor a repo may target is deliberately unnamed ANYWHERE in this file,
# comments included: resolve_extras() (setup/precommit.py) matches that vendor's name as a bare
# substring over the WHOLE lowered pyproject.toml text (no word boundary, comments not stripped) to
# decide whether a repo needs its Core-API-specific hooks. This engine has no such dependency — it
# distributes hooks to repos that may TARGET that vendor, it doesn't import its SDK — so even this
# very sentence describing the false positive would BE one; caught live via --check-drift on this
# repo (2026-08-07), twice (the description field, then this explanatory comment itself).
description = "Instantiable framework for provisioning a Claude Code coding-agent workspace"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "pinky-and-co" }]
# No `license = {file = "LICENSE"}` yet — no LICENSE file exists. Tracked, non-blocking, by card
# `choisir-license-pinky-workspace` (Apache-2.0 recommended, ADR-0065 decision 8).
# No third-party runtime dependency: every mode (--repo/--all/--check-drift, --agents-md) is
# stdlib-only.
dependencies = []

[project.scripts]
pinky = "cli_pinky:main"

[project.urls]
Repository = "https://github.com/pinky-and-co/pinky-bootstrap"

# Just `pytest`: pyyaml is already a core dependency (above), and the moteur's OWN pre-commit hooks
# (ruff/mypy/bandit/darglint/…) are provisioned hermetically by prek itself (`language: python` —
# see .github/workflows/hooks-portability.yml), not by this group. A lib's dev group carries its
# doc-build toolchain (mkdocs*) too; the moteur has none of that yet.
[dependency-groups]
dev = ["pytest"]

# ── uv ───────────────────────────────────────────────────────────────────────
[tool.uv]
# Fenêtre de cooldown contre une dépendance fraîchement compromise republiée sur PyPI (chantier
# 0024) : `uv lock`/`uv sync` ignorent tout paquet uploadé après cette date. Fenêtre glissante de
# 3 jours — avancée manuellement avant tout `uv lock` (discipline documentée dans l'AGENTS.md de
# `pinky-bootstrap`, pas de job planifié). Enregistrée dans `uv.lock` : `grep exclude-newer
# uv.lock` dit exactement quelle fenêtre a produit le lock courant.
exclude-newer = "2026-09-05T00:00:00Z"

# ── Packaging — flat layout, NOT src/ (ADR-0065 decision 6: src/ + the setup/ → pinky_workspace/
# rename are a LATER phase, 228 files across the parc reference render_docs.py's distributed copies).
#
# `setup` is a real Python package (packages=[...] below); `cli_pinky.py` is a loose top-level
# module (the sub-command dispatcher — see its own docstring); `agentic-harness/`, `hygiene/`,
# `scripts/`, `tools/` are NOT Python packages, they are data the CLI reads by path at runtime
# (AGENTIC_HARNESS_DIR/HYGIENE_DIR / the standalone scripts index) — SIBLINGS of `setup/` in today's
# repo layout, and they must stay siblings once installed, because common.py resolves them as
# `SCRIPT_DIR / "agentic-harness"` etc. and SCRIPT_DIR becomes the install root.
#
# THIS is the silent failure point the card names — a directory force-included in the wheel but
# missing from this list resolves to nothing once installed, and only actually running `uv tool
# install git+file://…` end to end (not `unzip -l`, which shows presence, never correctness of
# what's missing) catches it.
[tool.interrogate]
# Temporary ratchet baseline (card `remonter-seuil-interrogate-70-vers-80`, chantier 0024) — the
# `python` extra's interrogate hook started covering `setup/`/`hygiene/`/`tools/`/`cli_pinky.py`
# for real for the first time on 2026-09-08 (the `_py_lint_roots` fix), measured at 71.3%.
# interrogate's own default fail-under is 80% — never a policy this repo chose, just the tool's
# out-of-box value, now the first thing hit by turning coverage checking on where it had never run.
# Raise back toward 80 (or drop this section entirely) as the backfill in that card lands.
fail-under = 70

[tool.hatch.build.targets.wheel]
packages = ["setup"]

[tool.hatch.build.targets.wheel.force-include]
"cli_pinky.py" = "cli_pinky.py"
"agentic-harness" = "agentic-harness"
"hygiene" = "hygiene"
"live-docs" = "live-docs"
"scripts" = "scripts"
"tools" = "tools"

[tool.hatch.build.targets.sdist]
include = [
    "setup",
    "cli_pinky.py",
    "agentic-harness",
    "hygiene",
    "live-docs",
    "scripts",
    "tools",
    "README.md",
    "NOTICE",
    "CREDITS",
]
