# pytest config. The repo now ships a pyproject.toml (card pyproject-entry-point-et-ci-windows,
# 2026-08-07), but it carries no [tool.pytest.ini_options] table — this file stays the config slot
# rather than migrating, since nothing needs the two config files merged.
#
# testpaths — no longer load-bearing, kept as cheap insurance. It was added (card
# pytest-bracket-path-local) because the workspace then lived under a parent dir containing square
# brackets (`[PERSO] Workspaces`): with no positional arg, pytest derives the collection argument
# from the invocation dir, and its `[...]`-as-parametrization parser rejected that path outright
# ("path cannot contain [] parametrization"). The workspace was renamed bracket-free on 2026-07-25
# (`PERSO_Workspaces`) and bare `pytest` now runs fine without this line — verified 2026-08-07 by
# removing it and re-running (395 passed, 1 skipped, same as with it). Left in place anyway: it
# costs nothing, and it protects any OTHER clone path containing its own special character, not
# just the one incident that originally motivated it. CI is unaffected either way (clean checkout
# path). Historical incident: CHANTIER0001 pytest-bracket-path-local (archived).
#
# addopts — single source of truth for the run flags. --strict-markers turns an unknown marker into
# an error instead of a warning (relevant since the suite ships a custom `needs_private_corpus`
# marker, registered in tests/conftest.py). CI runs a bare `pytest`, so it inherits this too — the
# flag is NOT duplicated in .github/workflows/ci.yml.

[pytest]
testpaths = tests
addopts = --strict-markers
